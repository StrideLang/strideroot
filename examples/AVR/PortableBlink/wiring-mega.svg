<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>PortableBlink wiring: Arduino Mega 2560</title>
<rect width="800" height="470" fill="#ffffff"/>
<text x="40" y="38" font-size="20" font-weight="600" fill="#1b1b1b">PortableBlink on an Arduino Mega 2560</text>
<rect x="40" y="70" width="280" height="300" rx="14" fill="#2b6a9f"/>
<text x="64" y="108" font-size="20" font-weight="600" fill="#ffffff">Arduino Mega 2560</text>
<text x="64" y="132" font-size="14" fill="#e8f1f2">ATmega2560</text>
<circle cx="86" cy="186" r="9" fill="#ffd43b" stroke="#ffffff" stroke-width="2"/>
<text x="104" y="191" font-size="14" fill="#ffffff">L: the on-board LED</text>
<text x="104" y="210" font-size="12" fill="#e8f1f2">D13, PB7</text>
<text x="64" y="340" font-size="12" fill="#e8f1f2">Status blinks here; no wiring</text>
<rect x="312" y="113" width="14" height="14" fill="#111111" stroke="#cccccc"/>
<text x="302" y="125" font-size="14" text-anchor="end" fill="#ffffff" font-weight="600">5V</text>
<rect x="312" y="153" width="14" height="14" fill="#111111" stroke="#cccccc"/>
<text x="302" y="165" font-size="14" text-anchor="end" fill="#ffffff" font-weight="600">GND</text>
<rect x="312" y="213" width="14" height="14" fill="#111111" stroke="#cccccc"/>
<text x="302" y="225" font-size="14" text-anchor="end" fill="#ffffff" font-weight="600">D2</text>
<rect x="312" y="283" width="14" height="14" fill="#111111" stroke="#cccccc"/>
<text x="302" y="295" font-size="14" text-anchor="end" fill="#ffffff" font-weight="600">D7</text>
<rect x="580" y="190" width="180" height="145" rx="8" fill="#e7f0fa" stroke="#4a6fa5" stroke-width="2"/>
<text x="670" y="215" font-size="15" font-weight="600" text-anchor="middle" fill="#1b1b1b">Relay module</text>
<text x="670" y="234" font-size="12" text-anchor="middle" fill="#555555">switches on when IN is low</text>
<rect x="573" y="249" width="12" height="12" fill="#4a6fa5"/>
<text x="595" y="260" font-size="13" fill="#1b1b1b">VCC</text>
<rect x="573" y="284" width="12" height="12" fill="#4a6fa5"/>
<text x="595" y="295" font-size="13" fill="#1b1b1b">IN</text>
<rect x="573" y="309" width="12" height="12" fill="#4a6fa5"/>
<text x="595" y="320" font-size="13" fill="#1b1b1b">GND</text>
<polyline points="326,120 540,120 540,255 573,255" fill="none" stroke="#d62828" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="326,160 470,160 470,315 573,315" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="326,220 388,220" fill="none" stroke="#f08c00" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="390" cy="220" r="5" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<circle cx="446" cy="220" r="5" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<line x1="384" y1="202" x2="452" y2="202" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="418" y1="202" x2="418" y2="186" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<line x1="406" y1="186" x2="430" y2="186" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
<text x="418" y="176" font-size="13" text-anchor="middle" fill="#1b1b1b">push button</text>
<polyline points="451,220 470,220" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="470" cy="220" r="5" fill="#222222"/>
<path d="M 326 290 L 460 290 A 10 10 0 0 1 480 290 L 573 290" fill="none" stroke="#f08c00" stroke-width="4" stroke-linecap="round"/>
<text x="336" y="244" font-size="12" fill="#555555">PE4 (INT4),</text>
<text x="336" y="259" font-size="12" fill="#555555">pressed = low</text>
<text x="336" y="312" font-size="12" fill="#555555">PH4, low while</text>
<text x="336" y="327" font-size="12" fill="#555555">pressed</text>
<line x1="40" y1="400" x2="74" y2="400" stroke="#d62828" stroke-width="4" stroke-linecap="round"/>
<text x="82" y="405" font-size="13" fill="#1b1b1b">5V</text>
<line x1="160" y1="400" x2="194" y2="400" stroke="#222222" stroke-width="4" stroke-linecap="round"/>
<text x="202" y="405" font-size="13" fill="#1b1b1b">GND</text>
<line x1="280" y1="400" x2="314" y2="400" stroke="#f08c00" stroke-width="4" stroke-linecap="round"/>
<text x="322" y="405" font-size="13" fill="#1b1b1b">signal</text>
<text x="40" y="434" font-size="13" fill="#1b1b1b">No resistors: D2 uses the chip's internal pull-up, and D7 only pulls IN low or lets it go.</text>
<text x="40" y="454" font-size="13" fill="#1b1b1b">A 4-leg button connects its two legs on each long side; wire diagonally opposite legs.</text>
</svg>
